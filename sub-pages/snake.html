<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Set font type and viewpoint-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- keywords used when searching for website-->
    <meta name="keywords" content="personal website">

    <!-- Description of website (when searched for on search engine)-->
    <meta name="description" content="Nat Krah personal website">

    <!--Author of code-->
    <meta name="--Author" content="Nat Krah">

    <!-- Title of the website-->
    <title>Nat Krah | Snake</title>

    <!--Add an cool icon-->
    <link rel="icon" href="img/faveicon.png" type="image/x.icon">

    <!--Linking the css and js file-->
    <link rel="stylesheet" href="../styles/styles.css">
    <script defer src="../js/snake.js"></script>

<!--Load the current theme-->
    <script>
      (function() {
        const savedMode = localStorage.getItem('mode') || 'dark';
        const savedColor = localStorage.getItem('primaryColor') || '#007acc';
        document.documentElement.setAttribute('data-theme', savedMode);
        document.documentElement.style.setProperty('--primary-color', savedColor);
      })();
    </script>

</head>
<body>
    <section class="snake-section">
        <h1> <span class="nowrap">Take a Break:</span> <span class="nowrap"> Play Some Snake</span></h1>
        <canvas id="snakeGame" width="600" height="600"></canvas>
        <p><a href="../index.html" class="homeBtn">Home</a></p>
    </section>
</body>
</html>
